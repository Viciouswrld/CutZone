{% extends "base.html" %}
{% block title %}Admin — CutZone{% endblock %}

{% block content %}
<section class="py-4">
  <div class="container-fluid px-lg-4">
    <div class="row g-4">
      <!-- Sidebar -->
      <div class="col-lg-2">
        <div class="admin-sidebar p-3">
          <div class="text-gold small text-uppercase fw-bold mb-2 px-2">Admin Panel</div>
          <nav class="nav flex-column">
            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'dashboard:home' %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'appointments' %}active{% endif %}" href="{% url 'dashboard:appointments' %}"><i class="bi bi-calendar-check me-2"></i>Appointments</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'calendar' %}active{% endif %}" href="{% url 'dashboard:calendar' %}"><i class="bi bi-calendar3 me-2"></i>Calendar</a>
            <a class="nav-link {% if 'customer' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:customers' %}"><i class="bi bi-people me-2"></i>Customers</a>
            <a class="nav-link {% if 'barber' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:barbers' %}"><i class="bi bi-person-badge me-2"></i>Barbers</a>
            <a class="nav-link {% if 'schedule' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:schedules' %}"><i class="bi bi-clock me-2"></i>Schedules</a>
            <a class="nav-link {% if 'service' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:services' %}"><i class="bi bi-scissors me-2"></i>Services</a>
            <a class="nav-link {% if 'review' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:reviews' %}"><i class="bi bi-star me-2"></i>Reviews</a>
            <a class="nav-link {% if 'message' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:messages' %}"><i class="bi bi-envelope me-2"></i>Messages</a>
          </nav>
        </div>
      </div>
      <!-- Main -->
      <div class="col-lg-10">
        {% block dash_content %}{% endblock %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
