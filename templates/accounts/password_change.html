{% extends "base.html" %}
{% block title %}Change Password — CutZone{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <h4 class="text-center mb-4"><i class="bi bi-key text-gold me-2"></i>Change Password</h4>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-gold w-100">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
