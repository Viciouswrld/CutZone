{% extends "base.html" %}
{% block title %}Reset Link Sent — CutZone{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card text-center">
    <i class="bi bi-envelope-check text-gold fs-1"></i>
    <h4 class="mt-3">Check Your Email</h4>
    <p class="text-secondary">If an account exists with that email, a password reset link has been sent.
      On the local demo, check the terminal running the server.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-gold mt-2">Back to Login</a>
  </div>
</div>
{% endblock %}
